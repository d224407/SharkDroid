name: release

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NDK_VERSION: r27c
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.0"

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 patch flex bison
          python3 -m pip install --user --break-system-packages "meson>=1.4" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Android SDK platform
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          pkg=$("$sdk" --list 2>/dev/null | grep -oE 'platforms;android-37\.1' | sort -uV | head -n1)
          echo "platform package: ${pkg:-none (AGP will download)}"
          if [ -n "$pkg" ]; then "$sdk" "$pkg"; fi

      - name: NDK
        run: |
          want=$(grep -oP 'android-ndk-r27c-linux.zip\s+\S+\s+\(SHA1 matches [^:]*: \K[0-9a-f]{40}' SOURCES.txt)
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "$want  ndk.zip" | sha1sum -c -
          unzip -q ndk.zip -d "$RUNNER_TEMP"
          echo "NDK=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache native build
        id: native
        uses: actions/cache@v4
        with:
          path: app-project/app/src/main/jniLibs
          key: native-${{ hashFiles('SOURCES.txt', 'scripts/**', 'patches/**', 'helper/**', 'stubs/**') }}

      - name: Build native tools
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          python3 scripts/prepare-sources.py
          bash scripts/build-native.sh

      - name: Keystore
        env:
          KS_B64: ${{ secrets.d224407 }}
          KS_PASS: ${{ secrets.d224407_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=d224407"
            echo "keyPassword=$KS_PASS"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "SHARKDROID_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: app-project
        run: gradle :app:assembleRelease

      - name: Collect files
        run: |
          mkdir out
          ver=$(grep -oP 'versionName = "\K[^"]+' app-project/app/build.gradle.kts)
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          cp app-project/app/build/outputs/apk/release/app-release.apk "out/SharkDroid-${ver}.apk"
          cp SOURCES.txt out/
          (cd out && sha256sum * > SHA256SUMS)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/SharkDroid-*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: out/*

      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --target "$(git rev-parse HEAD)" --title "$tag" --generate-notes
          fi
